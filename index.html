<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carta Salasilah Keluarga</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-header">
    <div class="top-bar">
      <h2>Carta Salasilah Keluarga</h2>
      <div class="top-actions">
        <button id="toggleEditBtn" type="button">Buka Panel Edit</button>
        <button id="printBtn" type="button" class="secondary-btn">Print / PDF</button>
      </div>
    </div>

    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Cari nama dalam carta..." />
      <button id="clearSearchBtn" type="button" class="secondary-btn">Reset Cari</button>
    </div>

    <div id="editPanel" class="edit-panel hidden">
      <p class="hint">
        Taip satu nama atau pasangan (<b>Hamat + Zimah</b>) setiap baris. Tekan <b>Tab</b> (atau beri jarak depan) untuk jadikan baris itu sebagai <b>anak</b> di bawah baris di atasnya.
      </p>

      <textarea
        id="smartArtInput"
        rows="10"
        placeholder="Contoh:&#10;Hamat + Zimah&#10;  Maimun&#10;    Sukeri&#10;    Lutfi + Huda&#10;      Rayyan&#10;      Fayyadh&#10;  C.Ja"
      ></textarea>

      <div class="controls">
        <button id="applyTreeBtn" type="button">Kemas Kini Carta</button>
        <button id="closeEditBtn" type="button" class="secondary-btn">Tutup Panel</button>
      </div>
    </div>

    <p id="statusMsg">Panel edit ditutup. Tekan "Buka Panel Edit" untuk menyusun senarai.</p>
  </div>

  <div class="tree-wrapper">
    <div class="tree" id="tree"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
